# Pull agent for one device. Settings come from .env (copy .env.example).
#   docker compose up -d          start (and on every boot)
#   docker compose logs -f        watch
# The project name (ZK_PULL_NAME) also names the state volume: keep it when updating to a newer
# package, so the agent keeps its place. For a second device, use another folder and another name.
name: ${ZK_PULL_NAME:-zk-pull}

services:
  zk-pull:
    image: ${ZK_PULL_IMAGE:-zk-pull-agent}:${ZK_PULL_TAG:-latest}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}  # log timestamps only; punch times come from the device as-is
    command:
      - "${DEVICE_IP:?set DEVICE_IP in .env}"
      - "${SITE_URL:?set SITE_URL in .env}"
      - --comm-key
      - "${COMM_KEY:-0}"
      - --interval
      - "${INTERVAL:-120}"
      - --since
      - "${SINCE:-1970}"
    volumes:
      - state:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  state:
