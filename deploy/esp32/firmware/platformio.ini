; ESP32 pull agent firmware (prototype). See ../README.md.
;
;   pio run -e esp32dev                 build
;   pio run -e esp32dev -t upload       flash (board on USB)
;   pio device monitor                  serial log (115200)
;   pio test -e native                  protocol unit tests on this computer

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall
