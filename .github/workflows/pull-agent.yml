# Pull agent image: test and build on every change; publish to GHCR from main (as edge) and v* tags
# (as the version and latest); attach the install packages (make pkg) to the GitHub release of a
# v* tag. Nothing is published unless the app's unit tests (app-tests.yml) pass.
name: pull-agent

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - deploy/pull-agent/**
      - tools/pull_from_device.py
      - tools/backfill_from_device.py
      - tools/export_device_users.py
      - zk_push/__init__.py
      - .dockerignore
      - .github/workflows/pull-agent.yml
      - .github/workflows/app-tests.yml
  pull_request:
    paths:
      - deploy/pull-agent/**
      - tools/**
      - zk_push/__init__.py
      - .dockerignore
      - .github/workflows/pull-agent.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/zk-pull-agent
  # Only main and v* tags publish; pull requests and manual runs on other branches just build.
  PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

jobs:
  tests:
    uses: ./.github/workflows/app-tests.yml

  image:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version
        id: version
        run: echo "version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' zk_push/__init__.py)" >> "$GITHUB_OUTPUT"

      - name: Tag must match __version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME}" = "v${{ steps.version.outputs.version }}"

      - name: Smoke test (amd64)
        run: make -C deploy/pull-agent test

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/pull-agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  packages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker
      - name: Build packages
        run: make -C deploy/pull-agent pkg
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/zk-pull-agent-*
            dist/SHA256SUMS
