# ESP32 pull agent firmware: protocol unit tests and a build with the example config.
name: esp32-firmware

on:
  push:
    branches: [main]
    paths: [deploy/esp32/**, .github/workflows/esp32-firmware.yml]
  pull_request:
    paths: [deploy/esp32/**, .github/workflows/esp32-firmware.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/esp32/firmware
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('deploy/esp32/firmware/platformio.ini') }}
      - run: pip install platformio==6.2.0
      - name: Unit tests (native)
        run: pio test -e native
      - name: Build
        run: |
          cp include/config.example.h include/config.h
          pio run -e esp32dev
